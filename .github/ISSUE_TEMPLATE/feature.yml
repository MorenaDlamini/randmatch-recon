name: Feature
description: A user story with testable acceptance criteria
labels: [feature]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who has it, and what happens today?
    validations:
      required: true
  - type: textarea
    id: story
    attributes:
      label: User story
      placeholder: As a <bookkeeper>, I want <...>, so that <...>.
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      description: Given / When / Then. Each one must map to a test.
      placeholder: |
        - Given ..., when ..., then ...
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
  - type: textarea
    id: risks
    attributes:
      label: Risks
      description: What could go wrong, and which test will catch it?
